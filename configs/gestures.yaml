# 手势定义与去抖（用户定义的交互方案 v5）
debounce:
  # v2: 窗口多数投票——window_ms 内某手势票数 >= min_votes 且占比
  # >= win_ratio 即确认为稳定手势（抗识别闪烁，适配 13~30fps）
  window_ms: 450
  win_ratio: 0.6
  min_votes: 3
  lost_ms: 300          # 手部丢失该时长后判为 Lost（保持不动）

record:
  rate_hz: 50           # 轨迹记录频率
  play_speed: 1.0       # 回放倍速

# 手势 -> 动作（interaction_fsm.py 内置映射的实现说明）
# Okay        : 跟随模式 <-> 待机 切换（上电默认待机）
#   跟随模式中 臂协同追手（方位/水平线/前后安全距离）；
#   夹爪 1:1 镜像拇指-中指指尖距离（满行程 100mm，捏拢=闭合/张开=全开）
# Thumb_Up    : 复位 -> 回初始姿态（保持使能，停在待机）
# ILoveYou    : 回放最近一次录制
# Lost        : 手部丢失 -> 保持当前位姿
# 注：点赞/碰拳动作编排（点头/摇头）与 ACTION 模式已按用户要求移除
